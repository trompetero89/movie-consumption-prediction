version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_TAG="${IMAGE_TAG:-$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-12)}"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - echo "Using image tag $IMAGE_TAG"

  build:
    commands:
      - echo "Building inference container image..."
      - docker build -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" -f container/Dockerfile .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - echo "Pushed $ECR_REPOSITORY_URL:$IMAGE_TAG"
      - printf '{"imageTag":"%s"}' "$IMAGE_TAG" > image_tag.json

artifacts:
  files:
    - image_tag.json
