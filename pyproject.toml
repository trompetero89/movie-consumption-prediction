[project]
name = "movie-consumption-prediction"
version = "1.0.0"
description = "Inference solution for the Movie Consumption Prediction Challenge"
requires-python = ">=3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.3.5",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "streamlit>=1.38",
]

[project.scripts]
predict = "predict:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["predict"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
